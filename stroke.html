<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中風衛教資料整合系統</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px; /* 稍微加寬一點以容納更多選項 */
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        h3 {
            color: #34495e;
            margin-bottom: 15px;
        }
        .info-section {
            background-color: #e8f4f8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #d1e8ee;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: inline-block;
            width: 80px;
            font-weight: bold;
            color: #2c3e50;
        }
        .input-group input[type="text"] {
            width: calc(100% - 100px);
            padding: 8px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1em;
        }
        
        /* 針對多選項做雙欄排版優化 */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
            margin: 20px 0;
            font-size: 1.1em;
        }
        .checkbox-group label {
            display: block;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }
        .checkbox-group label:hover {
            background-color: #e2e6ea;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .btn-generate {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 24px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-generate:hover {
            background-color: #2980b9;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            color: #e74c3c;
        }
        .result-actions {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #bdc3c7;
        }
        .success-text {
            color: #27ae60;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 15px 24px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .btn-preview {
            background-color: #f39c12;
            color: white;
        }
        .btn-preview:hover {
            background-color: #d68910;
        }
        .btn-download {
            background-color: #27ae60;
            color: white;
        }
        .btn-download:hover {
            background-color: #219a52;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>中風衛教資料整合系統</h2>
    
    <div class="info-section">
        <h3>1. 輸入病患資訊</h3>
        <div class="input-group">
            <label for="bedNum">病房床號</label>
            <input type="text" id="bedNum" placeholder="例如：10A-01">
        </div>
        <div class="input-group">
            <label for="mrn">病歷號</label>
            <input type="text" id="mrn" placeholder="例如：12345678">
        </div>
        <div class="input-group">
            <label for="patientName">姓名</label>
            <input type="text" id="patientName" placeholder="例如：王小明">
        </div>
    </div>

    <h3>2. 勾選需發放的衛教單張</h3>
    <div class="checkbox-group">
        <label><input type="checkbox" value="Strokeintro"> 腦中風簡介 (Strokeintro)</label>
        <label><input type="checkbox" value="Anticoagulant"> 抗凝血劑 (Anticoagulant)</label>
        <label><input type="checkbox" value="Antiplatelet"> 抗血小板藥物 (Antiplatelet)</label>
        <label><input type="checkbox" value="Fall"> 預防跌倒衛教 (Fall)</label>
        <label><input type="checkbox" value="Hypertension"> 高血壓衛教 (Hypertension)</label>
        <label><input type="checkbox" value="Lipid"> 血脂衛教 (Lipid)</label>
        <label><input type="checkbox" value="NOAC.pdf"> 新型口服抗凝血劑 (NOAC)</label>
        <label><input type="checkbox" value="PassiveROM"> 被動關節活動 (PassiveROM)</label>
        <label><input type="checkbox" value="PharmOPD.pdf"> 藥師門診宣導 (PharmOPD)</label>
        <label><input type="checkbox" value="Pradaxa.pdf"> 普栓達 (Pradaxa)</label>
        <label><input type="checkbox" value="Statin.pdf"> 降血脂藥物 (Statin)</label>
    </div>

    <button class="btn-generate" onclick="mergeSelectedPDFs()">開始生成整合 PDF</button>
    
    <div id="status"></div>

    <div id="resultArea" class="result-actions" style="display: none;">
        <div class="success-text">✅ 衛教資料已合併成功！請選擇：</div>
        <button id="previewBtn" class="btn-action btn-preview">👀 直接用網頁開啟 (預覽)</button>
        <button id="downloadBtn" class="btn-action btn-download">📥 儲存檔案 / 下載</button>
    </div>
</div>

<script>
    async function mergeSelectedPDFs() {
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const previewBtn = document.getElementById('previewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
        
        const bedNum = document.getElementById('bedNum').value.trim();
        const mrn = document.getElementById('mrn').value.trim();
        const patientName = document.getElementById('patientName').value.trim();
        
        resultArea.style.display = 'none';
        statusDiv.textContent = '';

        if (checkboxes.length === 0) {
            statusDiv.textContent = '請至少勾選一個衛教選項！';
            statusDiv.style.color = '#e74c3c';
            return;
        }

        statusDiv.textContent = '正在處理並合併 PDF，請稍候...';
        statusDiv.style.color = '#27ae60';

        try {
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();

            for (const checkbox of checkboxes) {
                const fileName = checkbox.value;
                const response = await fetch(fileName);
                if (!response.ok) throw new Error(`找不到檔案: ${fileName}，請確認檔名大小寫與副檔名`);
                
                const arrayBuffer = await response.arrayBuffer();
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                
                const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                copiedPages.forEach((page) => {
                    mergedPdf.addPage(page);
                });
            }

            const mergedPdfBytes = await mergedPdf.save();
            
            const nameParts = [];
            if (bedNum) nameParts.push(bedNum);
            if (mrn) nameParts.push(mrn);
            if (patientName) nameParts.push(patientName);
            
            const finalFileName = nameParts.length > 0 
                ? `${nameParts.join('-')}中風衛教.pdf` 
                : '中風衛教.pdf';

            const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);

            previewBtn.onclick = function() {
                window.location.href = url;
            };

            downloadBtn.onclick = function() {
                const a = document.createElement('a');
                a.href = url;
                a.download = finalFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            
            statusDiv.textContent = '';
            resultArea.style.display = 'block';
            
        } catch (error) {
            console.error(error);
            statusDiv.textContent = `發生錯誤：${error.message}。請回 GitHub 檢查這份 PDF 是否存在！`;
            statusDiv.style.color = '#e74c3c';
        }
    }
</script>

</body>
</html>
